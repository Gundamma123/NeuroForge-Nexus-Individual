services:
  mysqldb:
    image: mysql:8.0
    container_name: neuroforge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: neuroforge_nexus
      MYSQL_USER: ${MYSQL_USER:-springuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    container_name: neuroforge-app
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      # ---- Database (must match mysqldb service above) ----
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/neuroforge_nexus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-springuser}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      # ---- JWT ----
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=86400000
      # ---- CORS ----
      - APP_CORS_ALLOWED_ORIGIN=http://localhost:5173
      # ---- GitHub App ----
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_CLIENT_ID=${GITHUB_APP_CLIENT_ID}
      - GITHUB_APP_CLIENT_SECRET=${GITHUB_APP_CLIENT_SECRET}
      - GITHUB_APP_WEBHOOK_SECRET=${GITHUB_APP_WEBHOOK_SECRET}
      - GITHUB_APP_REDIRECT_URI=http://localhost:8080/api/auth/github/callback
      - APP_FRONTEND_SETTINGS_URL=http://localhost:5173/profile
      # ---- Token encryption ----
      - APP_ENCRYPTION_SECRET=${APP_ENCRYPTION_SECRET}
      # ---- Ollama AI (safe non-secret defaults) ----
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
    depends_on:
      mysqldb:
        condition: service_healthy

volumes:
  mysql_data:
