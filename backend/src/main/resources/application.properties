# ---------- Server ----------
server.port=8080
server.servlet.context-path=/api

# ---------- MySQL ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/neuroforge_nexus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---------- JWT ----------
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ---------- GitHub App Integration ----------
github.app.id=${GITHUB_APP_ID}
github.app.client-id=${GITHUB_APP_CLIENT_ID}
github.app.client-secret=${GITHUB_APP_CLIENT_SECRET}

github.app.private-key-path=classpath:github-app-key.pem
github.app.webhook-secret=${GITHUB_APP_WEBHOOK_SECRET:}

app.encryption.secret=${APP_ENCRYPTION_SECRET}

github.app.redirect-uri=${GITHUB_APP_REDIRECT_URI:http://localhost:8080/api/auth/github/callback}
app.frontend.settings-url=${APP_FRONTEND_SETTINGS_URL:http://localhost:5173/profile}

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2}